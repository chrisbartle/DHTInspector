# Builds the Linux AppImage and the static Windows .exe and, for a tag,
# publishes both as a release.
#
# Run it by hand from the Actions tab to exercise everything except the
# publishing step; push a v* tag to publish.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # the release job creates a release and uploads to it

env:
  # Pinned rather than a 6.11.* range: the Windows job builds Qt from
  # source, which needs an exact version, and a release that can be rebuilt
  # from its tag is worth more than picking up patch releases silently.
  QT_VERSION: "6.11.2"
  # The runners carry no libfuse2, so the AppImage tools have to unpack
  # themselves rather than mount.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  # Cheap, and first: a mismatched tag should not cost an hour of Windows
  # runner time before anyone notices.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          project=$(sed -n '/^project(/,/^)/ s/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\).*/\1/p' CMakeLists.txt | head -1)
          tag=${GITHUB_REF_NAME#v}
          # Compare major.minor.patch only: project() may carry a fourth
          # field that a tag would not normally spell out.
          trim() { cut -d. -f1-3 <<<"$1"; }
          if [ "$(trim "$tag")" != "$(trim "$project")" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $project in CMakeLists.txt"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches project version $project"

  appimage:
    needs: check
    # Deliberately not ubuntu-latest. An AppImage runs only on a glibc at
    # least as new as the one it was built against, so the oldest supported
    # runner is the one that reaches the most distributions.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-xcb-dev libxcb1-dev libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1-dev libfreetype6-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Fetch linuxdeploy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$HOME/.local/bin/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-qt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and package
        run: ./packaging/linux/build-appimage.sh

      - name: Test
        # Nothing here needs a display, and the engine suite binds loopback
        # sockets only.
        run: ctest --test-dir build-appimage --output-on-failure

      - name: Keep the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/DHTInspector-x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # Qt publishes no static binaries for Windows, so this builds one. It
      # is the slow part of the job by a wide margin, and the only reason
      # the cache exists. A hit makes the step below disappear entirely.
      - name: Restore the static Qt build
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-windows-2022-msvc

      - name: Build static Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath > "%TEMP%\vs.txt"
          set /p VSPATH=<"%TEMP%\vs.txt"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          rem Absolute paths throughout: the workspace is on another drive,
          rem and a bare "cd C:\..." would change directory there without
          rem switching to it. --strip-components drops the archive's own
          rem top-level folder, so the source path never has to spell out
          rem the version.
          mkdir C:\qt-src
          for %%m in (qtbase qtshadertools qtdeclarative) do (
            curl -fsSL -o C:\qt-src\%%m.zip https://download.qt.io/archive/qt/6.11/%QT_VERSION%/submodules/%%m-everywhere-src-%QT_VERSION%.zip || exit /b 1
            mkdir C:\qt-src\%%m || exit /b 1
            tar -xf C:\qt-src\%%m.zip -C C:\qt-src\%%m --strip-components=1 || exit /b 1
          )
          dir C:\qt-src

          rem BUILD_SHARED_LIBS=OFF gives a static Qt; static_runtime links
          rem the MSVC runtime in as well, so the .exe needs no
          rem redistributable alongside it.
          cmake -S C:\qt-src\qtbase -B C:\qt-src\b-qtbase -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DFEATURE_static_runtime=ON ^
            -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF ^
            -DCMAKE_INSTALL_PREFIX=C:\Qt-static || exit /b 1
          cmake --build C:\qt-src\b-qtbase --parallel || exit /b 1
          cmake --install C:\qt-src\b-qtbase || exit /b 1

          rem Qt Quick needs the shader tools, so they come first.
          for %%m in (qtshadertools qtdeclarative) do (
            cmake -S C:\qt-src\%%m -B C:\qt-src\b-%%m -G Ninja ^
              -DCMAKE_BUILD_TYPE=Release ^
              -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF ^
              -DCMAKE_PREFIX_PATH=C:\Qt-static ^
              -DCMAKE_INSTALL_PREFIX=C:\Qt-static || exit /b 1
            cmake --build C:\qt-src\b-%%m --parallel || exit /b 1
            cmake --install C:\qt-src\b-%%m || exit /b 1
          )

      - name: Build
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath > "%TEMP%\vs.txt"
          set /p VSPATH=<"%TEMP%\vs.txt"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build\win-static -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=C:\Qt-static || exit /b 1
          cmake --build build\win-static || exit /b 1

      - name: Test
        run: ctest --test-dir build\win-static --output-on-failure

      # No version in the name, so a link to the latest release's download
      # never changes. The version is in the file's own properties, from the
      # resource script.
      - name: Stage the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\win-static\DHTInspector.exe dist\DHTInspector-x64.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: List what the executable needs
        shell: cmd
        # It should want nothing but Windows itself. Printing the imports
        # means a stray dependency shows up here rather than on somebody's
        # machine.
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath > "%TEMP%\vs.txt"
          set /p VSPATH=<"%TEMP%\vs.txt"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          dumpbin /DEPENDENTS dist\DHTInspector-x64.exe

      - name: Keep the executable
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/DHTInspector-x64.exe
          if-no-files-found: error

  release:
    needs: [appimage, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Named outright rather than globbed: a missing or misnamed file
          # should stop the release, not shrink it.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DHT Inspector ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/DHTInspector-x86_64.AppImage \
            dist/DHTInspector-x64.exe
